[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-platform"
version = "3.9.0"
description = "Modular AI quantitative research and portfolio platform"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "APScheduler>=3.11,<4",
  "pandas>=2.2",
  "numpy>=1.26",
  "requests>=2.31,<3",
  "waitress>=3,<4",
  "pyarrow>=17",
  "PyJWT[crypto]>=2.8,<3",
  "gunicorn>=23,<24; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
  "scikit-learn>=1.5",
  "optuna>=4",
]
data = ["yfinance>=0.2", "tzdata>=2025.2"]
ml = ["scikit-learn>=1.5", "xgboost>=2.1", "lightgbm>=4.5", "catboost>=1.2", "optuna>=4", "shap>=0.46"]
rl = ["torch>=2.5,<3"]
rag-gpu = ["torch>=2.5,<3", "sentence-transformers>=3.3,<4"]
infra = ["psycopg[binary]>=3.2", "redis>=5", "alembic>=1.14"]

[project.scripts]
quant-web = "quant_platform.dashboard.app:main"
quant-api = "quant_platform.api.app:main"
quant-pipeline = "quant_platform.scheduler.cli:main"
quant-worker = "quant_platform.scheduler.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_platform = ["dashboard/templates/*.html", "dashboard/templates/v2/*.html","dashboard/static/css/*.css", "dashboard/static/js/*.js", "dashboard/static/*.svg", "market_calendar/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
