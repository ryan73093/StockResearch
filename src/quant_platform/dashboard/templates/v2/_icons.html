{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
{%- if name == 'today' -%}
<rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M8 2.8v3.4M16 2.8v3.4M3.5 9.5h17M9 15l2 2 4-4"/>
{%- elif name == 'holdings' -%}
<path d="M20.5 13.5A8.5 8.5 0 1 1 10.5 3.6V13.5z"/><path d="M14 3.2a8.5 8.5 0 0 1 6.8 6.8H14z"/>
{%- elif name == 'plan' -%}
<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>
{%- elif name == 'research' -%}
<path d="M9.5 3h5M10.5 3v5.5L5 18.2A1.9 1.9 0 0 0 6.7 21h10.6a1.9 1.9 0 0 0 1.7-2.8L13.5 8.5V3"/><path d="M7.4 15h9.2"/>
{%- elif name == 'system' -%}
<path d="M3 12h4l2.5-6 5 12 2.5-6h4"/>
{%- elif name == 'sun' -%}
<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>
{%- elif name == 'moon' -%}
<path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/>
{%- elif name == 'copy' -%}
<rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5v-3a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/>
{%- elif name == 'clock' -%}
<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- elif name == 'arrow' -%}
<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'spark' -%}
<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>
{%- elif name == 'market' -%}
<path d="M6 4v3M6 15v4M12 3v4M12 13v3M18 7v3M18 17v3"/><rect x="4.5" y="7" width="3" height="8" rx=".8"/><rect x="10.5" y="7" width="3" height="6" rx=".8"/><rect x="16.5" y="10" width="3" height="7" rx=".8"/>
{%- elif name == 'search' -%}
<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/>
{%- elif name == 'help' -%}
<circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.8c0 1.7-2.4 2.1-2.4 3.7"/><path d="M12 16.8v.1"/>
{%- elif name == 'check' -%}
<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro brand_mark() -%}

{%- endmacro %}
